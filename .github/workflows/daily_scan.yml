name: Daily Market Sentiment Robot 🤖

# 1. TRIGGER: When does this run?
on:
  schedule:
    # Runs at 9:27 PM UTC every day
    # (You can adjust this later using crontab.guru)
    - cron: '27 21 * * *'
  # This enables the manual "Run Workflow" button for testing
  workflow_dispatch:

jobs:
  run-market-intelligence:
    runs-on: ubuntu-latest

    steps:
      # Step A: Get your code
      - name: Check out repository
        uses: actions/checkout@v3

      # Step B: Install Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step C: Install libraries
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Step D: Run the Brain
      # We explicitly pass the SECRET into the environment
      - name: Run Market Intelligence Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python main.py